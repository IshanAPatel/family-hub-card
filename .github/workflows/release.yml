name: Release

# Re-runs the full gate against the tagged commit, then attaches the built card
# to the release. HACS installs a plugin from the release asset when one is
# present, so this asset is what users actually download.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build and attach card
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          # This job's token can write to the repo. Left persisted, it sits in
          # .git/config while npm install scripts and build plugins run, so any
          # compromised dependency could read it and push. Nothing here uses git
          # over the network, so drop it.
          persist-credentials: false

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm run build

      - name: Attach card to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/family-hub-card.js
